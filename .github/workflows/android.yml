# Сборка APK-обёртки (android/) и выкладка в релиз «android».
# Телефон качает свежий APK со страницы Releases — одна и та же ссылка всегда.
#
# Секреты (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64   ключ подписи PKCS12 в base64 (alias pillar)
#   ANDROID_KEYSTORE_PASS  пароль к нему
# Без них APK подпишется отладочным ключом раннера — он каждый раз новый,
# и обновлять поверх не выйдет: только удалить и поставить заново.
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/pillar.p12"
            echo "PV_KEYSTORE=$RUNNER_TEMP/pillar.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 не задан — подпись отладочным ключом"
          fi

      - name: Сборка
        working-directory: android
        env:
          PV_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pillar-vault.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pillar-vault-apk
          path: ${{ runner.temp }}/pillar-vault.apk

      # Кнопка «Обновить приложение» качает APK с самого хранилища: релиз
      # приватного репозитория телефону без входа в GitHub недоступен.
      # Сюда — ветка android-apk с одним перезаписываемым коммитом, сервер
      # забирает её в deploy.sh. Только с настоящим ключом: APK с отладочным
      # поверх установленного не встанет.
      - name: APK для сервера
        if: env.PV_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/android-apk"
          mkdir -p "$dir" && cd "$dir"
          git init -q -b android-apk
          cp "$RUNNER_TEMP/pillar-vault.apk" .
          # Имя версии — тройками, как в build.gradle: 3, 6, 9, 33, 36…
          tri() {
            n=$1; s=""
            while [ "$n" -gt 0 ]; do
              r=$((n % 3)); [ "$r" -eq 0 ] && r=3
              s=$(printf '369' | cut -c "$r")$s
              n=$(( (n - r) / 3 ))
            done
            out=""
            while [ ${#s} -gt 3 ]; do out=".${s: -3}$out"; s=${s%???}; done
            printf '%s%s' "$s" "$out"
          }
          printf '{"code":%s,"name":"%s","sha":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$(tri "$GITHUB_RUN_NUMBER")" "${GITHUB_SHA::7}" > version.json
          git add pillar-vault.apk version.json
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -qm "android: сборка #${GITHUB_RUN_NUMBER} из ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-apk

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Сборка #${GITHUB_RUN_NUMBER} из ${GITHUB_SHA::7}. Открой на телефоне, скачай pillar-vault.apk и установи."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android "$RUNNER_TEMP/pillar-vault.apk" --clobber
            gh release edit android --notes "$notes"
          else
            gh release create android "$RUNNER_TEMP/pillar-vault.apk" --title "Android-приложение" --notes "$notes" --target "$GITHUB_SHA"
          fi
