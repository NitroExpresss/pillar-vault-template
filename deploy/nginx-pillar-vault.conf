# Pillar Vault — nginx перед контейнером.
#
# Поместить в /etc/nginx/sites-available/pillar-vault, сделать симлинк в
# sites-enabled, затем:  nginx -t && systemctl reload nginx
# TLS выпускает certbot:  certbot --nginx -d vault.example.com -d www.vault.example.com
# (он сам добавит сюда listen 443, пути к сертификатам и редирект с HTTP).
#
# Basic Auth не нужен: пароль проверяет сам сервер, а гостю без сессии
# уходит пустая витрина — ни одной карточки.

server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com www.vault.example.com;

    # запас на длинные карточки при сохранении из редактора
    client_max_body_size 4m;

    # Сжатие: сборка индекса крупная, но текстовая — жмётся в разы.
    # text/javascript обязателен: Go (как и все браузеры с 2020-го) отдаёт .js
    # именно этим типом, а не application/javascript. Без него самый тяжёлый
    # ответ хранилища уходил бы к клиенту без сжатия.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # ── общие заголовки безопасности ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # по нему сервер понимает, что кука сессии должна быть Secure
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
